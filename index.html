<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATHLETIX ROW</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,sans-serif;background:#f4f6fa;color:#111827}
.app{max-width:500px;margin:auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:22px;font-weight:900}.logo span{color:#2563eb}
.tag{background:#e8efff;color:#2563eb;padding:7px 10px;border-radius:20px;font-size:12px}
.hero{background:#111827;color:white;padding:22px;border-radius:24px;margin-bottom:12px}
.hero h1{font-size:42px;margin:5px 0}
.card{background:white;padding:17px;border-radius:20px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:13px;color:#7c8799}.big{font-size:25px;font-weight:900;margin-top:5px}
button{cursor:pointer}.primary{width:100%;padding:15px;border:0;border-radius:14px;background:#2563eb;color:white;font-size:16px;font-weight:800}
.scores{display:flex;gap:5px;overflow:auto;margin-top:12px}
.score{min-width:38px;height:38px;border:0;border-radius:11px;background:#edf1f6;font-weight:700}
.score.on{background:#2563eb;color:white}
.page{display:none}.page.on{display:block}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #d8dee8;border-radius:12px;font-size:16px;background:white}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #ddd;padding:8px}
.nav button{border:0;background:none;padding:8px;color:#7c8799}.nav button.on{color:#2563eb;font-weight:800}
.nav b{display:block;font-size:19px}
</style>
</head>
<body>

<div class="app">
<header><div class="logo">ATHLETIX <span>ROW</span></div><div class="tag">조정부 MVP</div></header>

<div id="home" class="page on">
<div class="hero"><small>다음 대회</small><h1>D-18</h1><div>전국체육대회</div></div>
<div class="grid">
<div class="card"><div class="small">오늘 컨디션</div><div class="big"><span id="condText">7</span>/10</div></div>
<div class="card"><div class="small">2K PB</div><div class="big" id="pb1">6:44.0</div></div>
</div>
<div class="card"><b>오늘 컨디션</b><div id="scores" class="scores"></div></div>
<button class="primary" onclick="go('train')">＋ 훈련 기록하기</button>
</div>

<div id="train" class="page">
<h2>훈련</h2>
<div class="card">
<select id="type"><option>수상</option><option>에르고</option><option>웨이트</option><option>러닝</option></select>
<input id="result" placeholder="예: 2K 6:48 / 수상 16km">
<input id="rpe" type="number" min="1" max="10" value="7">
<button class="primary" onclick="saveWorkout()">저장</button>
</div>
<div class="card"><b>최근 훈련</b><div id="list" class="small" style="margin-top:10px">기록 없음</div></div>
</div>

<div id="record" class="page">
<h2>기록</h2>
<div class="card">
<div class="small">2K PB</div><div class="big" id="pb2">6:44.0</div>
<input id="pbinput" placeholder="예: 6:42.5">
<button class="primary" onclick="savePB()">PB 저장</button>
</div>
</div>

<div id="competition" class="page">
<h2>대회</h2>
<div class="card"><div class="row"><b>전국체육대회</b><b>D-18</b></div></div>
<div class="card small">대한조정협회 일정 자동 연동은 다음 버전에서 추가</div>
</div>

<div id="my" class="page">
<h2>MY</h2>
<div class="card">
<input placeholder="이름">
<input placeholder="학교">
<select><option>고1</option><option selected>고2</option><option>고3</option></select>
<button class="primary">저장</button>
</div>
</div>
</div>

<div class="nav">
<button class="on" onclick="go('home',this)"><b>⌂</b>홈</button>
<button onclick="go('train',this)"><b>＋</b>훈련</button>
<button onclick="go('record',this)"><b>↗</b>기록</button>
<button onclick="go('competition',this)"><b>★</b>대회</button>
<button onclick="go('my',this)"><b>●</b>MY</button>
</div>

<script>
let cond=localStorage.cond||7;
let pb=localStorage.pb||"6:44.0";
let workouts=JSON.parse(localStorage.workouts||"[]");

function go(id,b){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
document.getElementById(id).classList.add("on");
if(b){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}
}

function scores(){
let box=document.getElementById("scores");box.innerHTML="";
for(let i=1;i<=10;i++){
let b=document.createElement("button");b.className="score"+(i==cond?" on":"");b.textContent=i;
b.onclick=()=>{cond=i;localStorage.cond=i;document.getElementById("condText").textContent=i;scores()};
box.appendChild(b)
}}
function saveWorkout(){
let result=document.getElementById("result").value.trim();if(!result)return alert("기록 입력해줘");
workouts.unshift({type:document.getElementById("type").value,result,rpe:document.getElementById("rpe").value});
localStorage.workouts=JSON.stringify(workouts);document.getElementById("result").value="";draw()
}
function draw(){
document.getElementById("list").innerHTML=workouts.length?workouts.slice(0,5).map(x=>`<div class="row"><span>${x.type} · RPE ${x.rpe}</span><b>${x.result}</b></div>`).join(""):"기록 없음"
}
function savePB(){
let x=document.getElementById("pbinput").value.trim();if(!x)return;pb=x;localStorage.pb=x;document.getElementById("pb1").textContent=x;document.getElementById("pb2").textContent=x
}
document.getElementById("condText").textContent=cond;
document.getElementById("pb1").textContent=pb;
document.getElementById("pb2").textContent=pb;
scores();draw();
</script>
</body>
</html>
