<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b30"><title>ATHLETIX Rowing</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="app"><header><div class="logo">ATHLETIX <span>ROWING</span></div><div class="pill">MY TRAINING LOG</div></header>
<section id="home" class="page on"><div class="hero"><small>다음 대회까지</small><h1 id="homeDday">대회 등록</h1><strong id="homeEvent">날짜를 설정해 주세요</strong></div><div class="grid"><div class="card"><div class="muted">오늘 컨디션</div><div class="number"><span id="homeCondition">—</span><small>/ 10</small></div></div><div class="card"><div class="muted">2,000m PB</div><div class="number" id="homePb">—</div></div></div><div class="card"><h2>오늘의 체크인</h2><label>컨디션 <output id="conditionOut">7</output>/10<input id="condition" type="range" min="1" max="10" value="7"></label><label>수면 시간<input id="sleep" type="number" min="0" max="24" step="0.5" inputmode="decimal" placeholder="시간"></label><button class="primary" id="saveCheckin">체크인 저장</button></div><div class="card"><h2>이번 주</h2><div id="weekStats" class="muted"></div></div><button class="primary" data-page="train">＋ 훈련 기록하기</button></section>
<section id="train" class="page"><h1>훈련 기록</h1><div class="card"><label>날짜<input id="date" type="date"></label><label>종목<select id="type"><option>수상</option><option>에르고</option><option>웨이트</option><option>러닝</option></select></label><div id="fields"></div><label>운동 강도 RPE <output id="rpeOut">7</output>/10<input id="rpe" type="range" min="1" max="10" value="7"></label><label>메모 (선택)<input id="note" maxlength="160" placeholder="느낌이나 훈련 내용"></label><button class="primary" id="saveWorkout">훈련 저장</button></div><div class="card"><h2>최근 훈련</h2><div id="workouts"></div></div></section>
<section id="record" class="page"><h1>PB 기록</h1><div class="card"><label>종목<select id="pbType"><option value="erg2000">에르고 2,000m</option><option value="erg5000">에르고 5,000m</option><option value="erg30">에르고 30분 거리</option><option value="run5000">러닝 5km</option><option value="run8000">러닝 8km</option></select></label><div id="pbFields"></div><button class="primary" id="savePb">PB 저장</button></div><div class="card"><h2>내 최고 기록</h2><div id="pbList"></div></div></section>
<section id="competition" class="page"><h1>대회 D-day</h1><div class="card"><label>대회명<input id="eventName" maxlength="70" placeholder="예: 전국체육대회"></label><label>대회 날짜<input id="eventDate" type="date"></label><button class="primary" id="saveEvent">대회 저장</button></div><div class="card"><h2>예정 대회</h2><div id="events"></div></div></section>
<section id="analysis" class="page"><h1>AI 분석</h1><div class="card"><h2>주간 훈련 분석</h2><p class="muted">최근 7일 훈련과 체크인을 바탕으로 분석합니다.</p><button class="primary" id="analyzeWeek">주간 분석하기</button><div id="weekResult" class="result" aria-live="polite"></div></div><div class="card"><h2>Concept2 에르고 사진</h2><p class="muted">PM 모니터 전체 화면을 선명하게 촬영하세요. 읽힌 숫자를 직접 확인한 뒤 기록에 반영하세요.</p><label>사진 선택<input id="ergPhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><img id="preview" class="preview" alt="선택한 에르고 사진" hidden><button class="primary" id="analyzePhoto">사진 분석하기</button><div id="photoResult" class="result" aria-live="polite"></div></div></section></main>
<nav class="nav" aria-label="화면 이동"><button class="on" data-page="home">⌂<small>홈</small></button><button data-page="train">＋<small>훈련</small></button><button data-page="record">↗<small>PB</small></button><button data-page="competition">★<small>대회</small></button><button data-page="analysis">✦<small>AI</small></button></nav><script src="/app.js" defer></script></body></html>
